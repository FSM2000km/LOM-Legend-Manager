[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lom-legend-viewer"
version = "0.1.1"
description = "活俠伝の伝説TXTを管理するデスクトップビューアー"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.scripts]
legend-viewer = "legend_viewer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
